<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin | RafGodwin Shop</title><link rel="icon" href="assets/img/favicon.ico"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/shop.css"><!--seo--><meta name="robots" content="noindex,nofollow"><!--/seo--></head><body class="adm"><div class="layout"><nav class="side"><div class="brand">Raf<b>Godwin</b> Admin</div><button data-tab="dash" class="on">Dashboard</button><button data-tab="products">Products</button><button data-tab="orders">Orders</button><button id="logout">Logout</button><small id="who" style="color:#666;padding:10px 14px"></small></nav>
<div class="amain"><section id="t-dash"><div class="bar"><h2>Dashboard</h2></div><div class="stats"><div class="stat"><small>Total Products</small><b id="sP">0</b></div><div class="stat"><small>Total Orders</small><b id="sO">0</b></div><div class="stat"><small>Revenue (paid)</small><b id="sR">GHS 0</b></div></div></section>
<section id="t-products" hidden><div class="bar"><h2>Products</h2><button class="ab g" id="addBtn">+ Add Product</button></div><div class="tw"><table class="at"><thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Featured</th><th></th></tr></thead><tbody id="pBody"></tbody></table></div></section>
<section id="t-orders" hidden><div class="bar"><h2>Orders</h2><button class="ab g" id="csvBtn">Export CSV</button></div><div class="tw"><table class="at"><thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Phone</th><th>Total</th><th>Payment</th><th>Status</th><th></th></tr></thead><tbody id="oBody"></tbody></table></div></section></div></div>
<div class="modal" id="pm"><form class="mbox" id="pForm"><h3 id="pTitle">Add Product</h3><label for="f_name">Name</label><input id="f_name" type="text" required><div class="row"><div><label for="f_category">Category</label><select id="f_category"><option>Smart Home</option><option>Security</option><option>Solar</option></select></div><div><label for="f_badge">Badge</label><input id="f_badge" type="text" ></div></div><div class="row"><div><label for="f_price">Price (GHS)</label><input id="f_price" type="number" required step="0.01" min="0"></div><div><label for="f_old_price">Old Price</label><input id="f_old_price" type="number" step="0.01" min="0"></div></div><label for="f_stock">Stock</label><input id="f_stock" type="number" required min="0"><label for="f_description">Description</label><textarea id="f_description" rows="3"></textarea><label for="f_image">Image</label><input id="f_image" type="file" accept="image/*"><label style="display:flex;gap:8px;align-items:center"><input id="f_featured" type="checkbox" style="width:auto"> Featured</label><div class="foot"><button type="button" class="ab" data-close>Cancel</button><button class="ab g" id="saveBtn">Save</button></div></form></div>
<div class="modal" id="om"><div class="mbox"><h3>Order details</h3><div id="oDetail"></div><div class="foot"><button class="ab" data-close>Close</button><button class="ab g" id="markBtn">Mark Completed</button></div></div></div><div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/supabase.js"></script><script src="js/admin.js"></script></body></html>
